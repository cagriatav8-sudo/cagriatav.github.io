<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çağrı ATAV | Portfolio</title>
    <style>
        /* GENEL AYARLAR */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: #0d0d0d;
            color: #fff;
        }

        /* YILDIZLI ARKA PLAN VE MOUSE TAKİBİ */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* ANA KONTEYNER */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: auto repeat(2, 1fr);
            gap: 30px;
            padding: 50px;
            height: 100vh;
            box-sizing: border-box;
            opacity: 0;
            animation: fadeInContent 1s ease forwards;
            animation-delay: 3s; /* Loader bittikten sonra başlasın */
        }

        /* KIRMIZI KUTULARIN ORTAK STİLİ */
        .box {
            background: rgba(26, 26, 26, 0.9);
            border: 2px solid #ff0055;
            border-radius: 40px; /* Ekran görüntüsündeki gibi yuvarlak */
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: start;
            align-items: center;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.3);
        }

        .box h2 {
            margin: 0 0 15px 0;
            color: #ff0055;
            font-size: 1.4em;
            text-align: center;
        }

        .box p { margin: 5px 0; color: #ccc; }
        .box a { color: #ff0055; text-decoration: none; font-weight: bold; }

        /* SAĞ ÜST KUTU (ÇAĞRI ATAV VE LOGO) */
        #name-box {
            grid-column: 2;
            grid-row: 1;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            padding: 30px 50px;
            background: rgba(20, 20, 20, 0.95);
        }

        #name-box h1 {
            font-size: 2em;
            margin: 0 0 0 20px; /* Logo geldikten sonra sağa boşluk */
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }

        /* SONSUZLUK İŞARETİ (LOADER) */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s, visibility 1s, top 1s, left 1s, width 1s, height 1s; /* Kayma efekti */
        }

        .infinity-loader {
            position: relative;
            width: 80px;
            height: 40px;
        }

        .infinity-loader .curve {
            position: absolute;
            top: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 5px solid transparent;
            border-top-color: #ff0055;
            border-left-color: #ff0055;
            animation: rotateInfinity 2s linear infinite;
        }

        .infinity-loader .left-curve { left: 0; }
        .infinity-loader .right-curve {
            right: 0;
            animation-delay: -1s;
            border-top-color: #ff0055;
            border-right-color: #ff0055;
            border-left-color: transparent;
        }

        @keyframes rotateInfinity {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Loader kayarken kullanılacak sınıflar */
        #loader-wrapper.moving {
            position: absolute;
            top: 30px; /* name-box'ın top değeri */
            left: auto;
            right: 30px; /* name-box'ın right değeri */
            width: 80px; /* name-box'ın içindeki logo boyutu */
            height: 40px;
            background: transparent; /* Arka planı gizle */
            border-radius: 0;
        }

        #loader-wrapper.moving .infinity-loader {
            width: 60px; /* Kayarken küçülsün */
            height: 30px;
        }

        @keyframes fadeInContent {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div id="loader-wrapper">
        <div class="infinity-loader">
            <div class="curve left-curve"></div>
            <div class="curve right-curve"></div>
        </div>
    </div>

    <div class="grid-container">
        
        <div class="box" id="name-box">
            <h1>ÇAĞRI ATAV</h1>
        </div>

        <div class="box" id="mail-box">
            <h2>E-Posta</h2>
            <p><a href="mailto:cagriatav8@gmail.com">cagriatav8@gmail.com</a></p>
        </div>

        <div class="box" id="tel-box">
            <h2>Tel</h2>
            <p><a href="tel:05412213940">0541 221 39 40</a></p>
        </div>

        <div class="box" id="script-box">
            <h2>Script</h2>
            <p>JavaScript, Node.js</p>
        </div>

        <div class="box" id="whatsapp-box">
            <h2>Whatsapp</h2>
            <p>Çağrı ATAV</p>
            <p><a href="https://wa.me/905412213940" target="_blank">Sohbet Başlat</a></p>
        </div>

    </div>

    <script>
        // --- LOADER VE KAYMA EFEKTİ ---
        window.addEventListener('load', function() {
            const loaderWrapper = document.getElementById('loader-wrapper');
            const nameBox = document.getElementById('name-box');

            setTimeout(function() {
                // Kayma efektini başlat
                loaderWrapper.classList.add('moving');
                // name-box'ın içine taşıma (animasyon bittikten sonra)
                setTimeout(function() {
                    nameBox.prepend(loaderWrapper.querySelector('.infinity-loader'));
                    loaderWrapper.style.display = 'none'; // Geçici katmanı gizle
                }, 1000); // Kayma animasyonu süresi
            }, 2000); // 2 saniye sonra kaymaya başlasın
        });

        // --- YILDIZLI ARKA PLAN VE MOUSE TAKİBİ ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height, stars;

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = [];

            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * width
                });
            }
        }

        function update() {
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ff0055'; // Yıldızlar kırmızımsı olsun
            ctx.fillStyle = `rgba(255, 0, 85, ${0.5 + 0.5 * Math.random()})`; // Yanıp sönme

            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                let px = (star.x - width / 2) * (width / star.z) + width / 2;
                let py = (star.y - height / 2) * (width / star.z) + height / 2;
                let r = width / star.z * 1.5;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    ctx.beginPath();
                    ctx.arc(px, py, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        window.addEventListener('resize', init);
        window.addEventListener('mousemove', (e) => {
            // Mouse imlecine göre yıldızların merkezini değiştirme
            const mouseX = (e.clientX - width / 2) / width;
            const mouseY = (e.clientY - height / 2) / height;

            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                star.x -= mouseX * 50; // Kayma hızı
                star.y -= mouseY * 50;
            }
        });

        init();
        function animate() {
            update();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
