<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çağrı Atav | Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d0d0d;
            color: #fff;
        }

        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #0d0d0d, #1a1a1a);
            background-size: 200% 200%;
            animation: moveGradient 10s ease infinite;
            z-index: -1;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* İLETİŞİM BİLGİLERİ (SOL ÜST) */
        .contact-info {
            position: fixed;
            top: 20px;
            left: 20px;
            text-align: left;
            z-index: 100;
            font-size: 0.9em;
            color: #888;
            opacity: 0;
            animation: fadeInContent 1s ease forwards;
            animation-delay: 3.5s; /* İsim kutusuyla birlikte gelsin */
        }

        .contact-info p { margin: 5px 0; }
        .contact-info a { color: #ff0055; text-decoration: none; }

        /* SONSUZLUK LOADERI */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s, visibility 1s;
        }

        .infinity-loader {
            position: relative;
            width: 80px;
            height: 40px;
        }

        .infinity-loader .curve {
            position: absolute;
            top: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 5px solid transparent;
            border-top-color: #ff0055;
            border-left-color: #ff0055;
            animation: rotateInfinity 2s linear infinite;
        }

        .infinity-loader .left-curve { left: 0; }
        .infinity-loader .right-curve {
            right: 0;
            animation-delay: -1s;
            border-top-color: #ff0055;
            border-right-color: #ff0055;
            border-left-color: transparent;
        }

        @keyframes rotateInfinity {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader-wrapper.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* ANA İÇERİK */
        #main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            opacity: 0;
            animation: fadeInContent 1.5s ease forwards;
            animation-delay: 3s;
        }

        .name-box {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 50px 80px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* KÖŞE TASARIMI */
        .name-box::before, .name-box::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid #ff0055;
        }
        .name-box::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .name-box::after { bottom: -2px; right: -2px; border-top: none; border-left: none; }

        .name-box h1 {
            font-size: 3.5em;
            margin: 0;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .name-box p {
            color: #ff0055;
            margin-top: 10px;
            font-size: 1.1em;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        @keyframes fadeInContent {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>

    <div class="contact-info">
        <p>E-posta: <a href="mailto:cagriatav8@gmail.com">cagriatav8@gmail.com</a></p>
        <p>Tel: <a href="tel:05412213940">0541 221 39 40</a></p>
    </div>

    <div id="loader-wrapper">
        <div class="infinity-loader">
            <div class="curve left-curve"></div>
            <div class="curve right-curve"></div>
        </div>
    </div>

    <div id="main-content">
        <div class="name-box">
            <h1>Çağrı Atav</h1>
            <p>Yazılımcı</p>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loader-wrapper').classList.add('hidden');
            }, 3000);
        });
    </script>
</body>
</html>
